<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="referrer" content="no-referrer">
  <title>Тайный Санта</title>
  <link rel="stylesheet" href="./style.css?v=20261124-7">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="./app.js?v=20261124-7"></script>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main>
    <div id="notice" role="status" hidden></div>
    <section id="screen" aria-label="Тайный Санта">
      <div class="splash" role="status">
        <span class="splash-mark" aria-hidden="true">✦</span>
        <div>
          <p class="splash-title">Тайный Санта</p>
          <p class="splash-label">Загружаем обмен…</p>
        </div>
      </div>
    </section>
  </main>
  <template id="holiday-garland">
    <div class="garland" aria-hidden="true">
      <div class="garland-wire">
        <span style="--x: 6%; --y: 47%"></span>
        <span style="--x: 19%; --y: 78%"></span>
        <span style="--x: 34%; --y: 94%"></span>
        <span style="--x: 50%; --y: 100%"></span>
        <span style="--x: 66%; --y: 94%"></span>
        <span style="--x: 81%; --y: 78%"></span>
        <span style="--x: 94%; --y: 47%"></span>
      </div>
    </div>
  </template>
  <dialog aria-labelledby="confirm-title" aria-describedby="confirm-copy">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-copy"></p>
      <div class="actions">
        <button class="secondary" value="cancel">Отмена</button>
        <button class="primary" value="confirm" id="confirm-button"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
